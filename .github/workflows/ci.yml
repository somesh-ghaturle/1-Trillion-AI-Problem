name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trust
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trust -d trust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://trust:trust@localhost:5432/trust

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests (Postgres)
        run: python manage.py test core -v 2

      - name: Run tests (SQLite)
        run: DATABASE_URL= python manage.py test core

  e2e:
    # Full stack: docker compose (Postgres + gunicorn, DEBUG=0) exercised over HTTP
    runs-on: ubuntu-latest
    needs: test
    env:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: ci-e2e-password
      DJANGO_SECRET_KEY: ci-e2e-secret-key-not-for-production-0123456789abcdef
      E2E_PASSWORD: ci-e2e-password
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up --build -d
          timeout 180 bash -c 'until curl -sf localhost:8000/api/ > /dev/null; do sleep 2; done'

      - name: End-to-end checks
        run: python3 scripts/e2e.py

      - name: Restart does not re-seed or lose data
        run: |
          before=$(python3 scripts/e2e.py counts)
          docker compose restart web
          timeout 180 bash -c 'until curl -sf localhost:8000/api/ > /dev/null; do sleep 2; done'
          after=$(python3 scripts/e2e.py counts)
          echo "before: $before"; echo "after:  $after"
          [ "$before" = "$after" ]

      - name: Data persists across down/up
        run: |
          before=$(python3 scripts/e2e.py counts)
          docker compose down
          docker compose up -d
          timeout 180 bash -c 'until curl -sf localhost:8000/api/ > /dev/null; do sleep 2; done'
          after=$(python3 scripts/e2e.py counts)
          echo "before: $before"; echo "after:  $after"
          [ "$before" = "$after" ]

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
